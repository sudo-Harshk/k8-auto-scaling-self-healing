# Day 18 - ServiceMonitor for workload-v2
# Tells Prometheus to scrape /metrics from workload-v2 pods
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workload-v2
  namespace: workload-v2
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: workload-v2
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - workload-v2
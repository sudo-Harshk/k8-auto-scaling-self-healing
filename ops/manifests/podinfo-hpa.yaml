# Day 14 placeholder — HPA manifest (filled in Day 14 execution)
#
# The actual HPA tuning depends on whether podinfo's CPU utilization
# reaches the target threshold under realistic load. Day-6 baseline
# showed ~0.01 cores under 10 users, well below 70%. The Day-14
# HPA may need a low target (e.g., 5%) or custom-metric adapter to
# trigger reliably.
#
# Suggested starting point (revisit after Day-14 first run):

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: podinfo-hpa
  namespace: podinfo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: podinfo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
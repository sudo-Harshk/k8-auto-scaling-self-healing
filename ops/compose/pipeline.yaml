# SHIELD-AI pipeline — docker compose for the 4 services.
#
# Run:
#   docker compose -f ops/compose/pipeline.yaml up -d
#
# This brings up:
#   - producer:        pulls Prometheus metrics, publishes to k8s-metrics Kafka topic
#   - stream-processor: Faust worker, consumes k8s-metrics, emits k8s-features
#   - decision-engine: consumes k8s-features, runs ML, validates through shield,
#                       publishes to k8s-decisions
#   - actuator:        consumes k8s-decisions, re-validates, applies to cluster
#
# The services share the `k8-ai-ops:dev` image built via `make build-image`.
# Kafka and Prometheus are NOT included in this compose — they run as K8s
# services via `make deploy-kafka` and `make deploy-prometheus`.

version: "3.9"

services:
  producer:
    image: k8-ai-ops:dev
    container_name: shield-ai-producer
    working_dir: /code
    # Day-4 Kafka producer (the metrics_client just queries — it doesn't publish).
    command: ["src/kafka/producer.py"]
    environment:
      - PROMETHEUS_URL=http://localhost:9090
      - KAFKA_BOOTSTRAP=localhost:9094
      - METRICS_TOPIC=k8s-metrics
      - POLL_INTERVAL=10
      - WORKLOAD_NAMESPACE=workload-v2
      - WORKLOAD_DEPLOYMENT=workload-v2
      - PYTHONUNBUFFERED=1
    volumes:
      - ../../src:/code/src
    network_mode: host
    restart: unless-stopped

  stream-processor:
    image: k8-ai-ops:dev
    container_name: shield-ai-stream
    working_dir: /code
    # Override the python ENTRYPOINT — Faust apps need the `faust` CLI.
    entrypoint: ["faust"]
    command: ["-A", "src.streaming.stream_processor", "worker", "-l", "info"]
    environment:
      - KAFKA_BOOTSTRAP=localhost:9094
      - INPUT_TOPIC=k8s-metrics
      - OUTPUT_TOPIC=k8s-features
      - WINDOW_SECONDS=30
      - PYTHONUNBUFFERED=1
    volumes:
      - ../../src:/code/src
    network_mode: host
    depends_on:
      - producer
    restart: unless-stopped

  decision-engine:
    image: k8-ai-ops:dev
    container_name: shield-ai-decision
    working_dir: /code
    command: ["src/decision/decision_engine.py"]
    environment:
      - KAFKA_BOOTSTRAP=localhost:9094
      - INPUT_TOPIC=k8s-features
      - OUTPUT_TOPIC=k8s-decisions
      - REPLICA_MODEL_PATH=/code/data/replica_model.pkl
      - ANOMALY_MODEL_PATH=/code/data/anomaly_model.pkl
      - DECISIONS_LOG=/code/logs/decisions.log
      - PYTHONUNBUFFERED=1
    volumes:
      - ../../src:/code/src
      - ../../logs:/code/logs
      - ../../data:/code/data
    network_mode: host
    depends_on:
      - stream-processor
    restart: unless-stopped

  actuator:
    image: k8-ai-ops:dev
    container_name: shield-ai-actuator
    working_dir: /code
    command: ["src/kopf_operator/actuator.py"]
    environment:
      - KAFKA_BOOTSTRAP=localhost:9094
      - INPUT_TOPIC=k8s-decisions
      - SHIELD_CFG=/code/specs/safety_policy.yaml
      - WORKLOAD_NAMESPACE=workload-v2
      - WORKLOAD_DEPLOYMENT=workload-v2
      - OPERATOR_ACTIONS_LOG=/code/logs/operator_actions.log
      - PYTHONUNBUFFERED=1
      - KUBECONFIG=/root/.kube/config
    volumes:
      - ../../src:/code/src
      - ../../logs:/code/logs
      - ../../specs:/code/specs
      - ~/.kube:/root/.kube:ro
    network_mode: host
    depends_on:
      - decision-engine
    restart: unless-stopped

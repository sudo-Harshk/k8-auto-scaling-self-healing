# Baseline 1: Kubernetes HPA, CPU 60%, same 2..20 range as all controllers,
# default HPA behaviour (scale-up 0 s stabilisation, 100%/4 pods per 15 s;
# scale-down stabilisation set to 60 s to match the SHIELD-AI scale-down cooldown).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: podinfo-hpa, namespace: podinfo }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: podinfo }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 }
        - { type: Pods, value: 4, periodSeconds: 15 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60

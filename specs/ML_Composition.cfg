\* TLC model configuration for ML_Composition (Day 17 / P3)
\* Run with: cd specs && tlc ML_Composition.tla -config ML_Composition.cfg

\* Use the LivenessSpec to check both safety invariants and the liveness
\* property together. TLC runs the safety invariants at every reachable
\* state; the liveness property is checked via the temporal logic engine.
SPECIFICATION LivenessSpec

\* Constants (matched to Python safety_policy.yaml)
CONSTANTS
    MIN_REPLICAS = 1
    MAX_REPLICAS = 10
    COOLDOWN = 2
    MAX_SCALE_STEP = 2
    ML_OUTPUT_RANGE = 12

\* Shield-path safety invariants (MUST hold on every reachable state)
INVARIANT AllShieldInvariants
INVARIANT ShTypeOK
INVARIANT ShSafetyMinReplicas
INVARIANT ShSafetyMaxReplicas
INVARIANT ShSafetyScalingStep
INVARIANT ShSafetyHealNoScale
INVARIANT ShSafetyBoundedRate

\* Liveness property on the shield path
PROPERTY ShLivenessEventuallyScaleUp

\* We deliberately do NOT check MlSafetyMaxReplicas / MlSafetyMinReplicas
\* as invariants on the joint Spec -- they are expected to be violated by
\* the ML_Only path. To see the ML_Only counterexample, uncomment the
\* alternative specification below and run a separate TLC invocation:
\*
\*   SPECIFICATION MlSpec
\*   INVARIANT MlSafetyMaxReplicas
\*   INVARIANT MlSafetyMinReplicas
\*
\* TLC will report a short counterexample trace demonstrating the bug.

\* Bound the depth to keep the joint spec tractable.
\* The composition state space is bounded because:
\*   - shield path: 10 (replicas) * 4 (action) * 11 (target) * 11 (clock)^2
\*                 * 11 (rejects) * 11 (modifies) ~= 6.3M raw
\*   - ML-only path: 13 (replicas) * 5 (action) * 13 (target) * 11 (clock)^2
\*                  ~= 130K raw
\*   - product: ~810M raw states; TLC reduces via symmetry and depth bound.
\* Expected run time: ~4 min on commodity hardware, depth 53.


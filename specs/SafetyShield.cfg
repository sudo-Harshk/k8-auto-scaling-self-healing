\* TLC model configuration for SafetyShield
\* Run with: java -jar tla2tools.jar specs/SafetyShield.cfg

SPECIFICATION Spec

\* Constants
CONSTANTS
    MAX_REPLICAS = 10
    COOLDOWN = 2
    ANOMALY_THRESHOLD = 1

\* Invariants
INVARIANT TypeOK
INVARIANT SafetyMinReplicas
INVARIANT SafetyMaxReplicas
INVARIANT SafetyScalingStep
INVARIANT SafetyHealNoScale
INVARIANT SafetyBoundedRate

\* Symmetry reduction: replica counts are interchangeable, so we don't
\* enumerate every permutation of {1,2,3,...,10}. Disabled here because
\* the spec is small enough; uncomment if state space grows.
\* SYMMETRY Permutations(1..MAX_REPLICAS)

\* Bound the depth to keep TLC fast during development
CHECK_DEADLOCK FALSE
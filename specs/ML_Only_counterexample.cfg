\* TLC config for the ML_Only counterexample.
\* Run with: java -cp tla2tools.jar tlc2.TLC -config ML_Only_counterexample.cfg ML_Composition.tla
\*
\* This config verifies that the ML_Only path CAN violate MlSafetyMaxReplicas,
\* proving the shield is necessary.

SPECIFICATION MlSpec

CONSTANTS
    MIN_REPLICAS = 1
    MAX_REPLICAS = 10
    COOLDOWN = 2
    MAX_SCALE_STEP = 2
    ML_OUTPUT_RANGE = 12

\* ML_Only can violate these invariants
INVARIANT MlSafetyMinReplicas
INVARIANT MlSafetyMaxReplicas

CHECK_DEADLOCK FALSE
